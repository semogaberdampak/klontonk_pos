# Penyaji file statis untuk pengembangan lokal (menggantikan server.mjs). Aplikasi hanya HTML/JS/CSS;
# data dan login ada di Supabase, diakses langsung dari browser.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Selalu tanya server (304 bila tidak berubah), agar tidak memakai cache basi.
  add_header Cache-Control "no-cache" always;

  # Jangan sajikan berkas tersembunyi (.git, .env) maupun berkas non-aplikasi.
  location ~ /\. { return 404; }
  location ~ ^/(db|node_modules|tests)(/|$) { return 404; }
  location ~ ^/(compose\.yaml|nginx\.conf|README\.md)$ { return 404; }

  location / { try_files $uri $uri/ =404; }
}
